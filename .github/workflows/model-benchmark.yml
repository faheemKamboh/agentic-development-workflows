name: Model benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Model set
        type: choice
        options: [core, extended]
        default: core
      repetitions:
        description: Repetitions per model
        type: choice
        options: ['3', '5', '10']
        default: '10'
      fixture:
        description: Public benchmark fixture
        type: choice
        options: [small-ruby]
        default: small-ruby
  push:
    branches: [main]
    paths:
      - '.github/benchmark-request.json'

permissions:
  contents: read

concurrency:
  group: model-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      profile: ${{ steps.config.outputs.profile }}
      repetitions: ${{ steps.config.outputs.repetitions }}
      fixture: ${{ steps.config.outputs.fixture }}
      matrix: ${{ steps.models.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - id: config
        name: Resolve benchmark request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_REPETITIONS: ${{ inputs.repetitions }}
          INPUT_FIXTURE: ${{ inputs.fixture }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              request = {
                  'profile': os.environ.get('INPUT_PROFILE') or 'core',
                  'repetitions': os.environ.get('INPUT_REPETITIONS') or '10',
                  'fixture': os.environ.get('INPUT_FIXTURE') or 'small-ruby',
                  'enabled': True,
              }
          else:
              path = Path('.github/benchmark-request.json')
              if not path.exists() or not path.read_text().strip():
                  request = {'enabled': False}
              else:
                  request = json.loads(path.read_text())
                  request.setdefault('enabled', True)

          enabled = bool(request.get('enabled'))
          profile = str(request.get('profile', 'core'))
          repetitions = str(request.get('repetitions', '3'))
          fixture = str(request.get('fixture', 'small-ruby'))

          if enabled:
              if profile not in {'core', 'extended'}:
                  raise SystemExit(f'unsupported profile: {profile}')
              if repetitions not in {'3', '5', '10'}:
                  raise SystemExit(f'unsupported repetitions: {repetitions}')
              if fixture not in {'small-ruby'}:
                  raise SystemExit(f'unsupported fixture: {fixture}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"enabled={'true' if enabled else 'false'}\n")
              f.write(f'profile={profile}\n')
              f.write(f'repetitions={repetitions}\n')
              f.write(f'fixture={fixture}\n')
          PY

      - id: models
        if: steps.config.outputs.enabled == 'true'
        env:
          PROFILE: ${{ steps.config.outputs.profile }}
        run: |
          python3 - <<'PY'
          import json, os
          models = json.load(open('config/models.json'))['models']
          profile = os.environ['PROFILE']
          selected = [m for m in models if profile == 'extended' or m['tier'] == 'core']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'include': selected}, separators=(',', ':')) + '\n')
          PY

  benchmark:
    if: needs.prepare.outputs.enabled == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check private result sink
        env:
          CONTROL_REPO: ${{ secrets.CONTROL_REPO }}
          CONTROL_REPO_TOKEN: ${{ secrets.CONTROL_REPO_TOKEN }}
        run: |
          test -n "$CONTROL_REPO" || { echo 'Private result sink is not configured.'; exit 1; }
          test -n "$CONTROL_REPO_TOKEN" || { echo 'Private result sink is not configured.'; exit 1; }

      - name: Checkout runner
        uses: actions/checkout@v5

      - name: Checkout public fixtures
        uses: actions/checkout@v5
        with:
          repository: faheemKamboh/agentic-development-benchmarks
          path: benchmark-fixtures

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-${{ matrix.key }}-${{ matrix.quant }}-v1

      - name: Start model server
        env:
          HF_REPO: ${{ matrix.hf_repo }}
          QUANT: ${{ matrix.quant }}
        run: |
          mkdir -p .hf-cache results
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --name llm-server \
            --cpus=4 \
            -p 8080:8080 \
            -v "$PWD/.hf-cache:/root/.cache/huggingface/hub" \
            ghcr.io/ggml-org/llama.cpp:server \
            -hf "${HF_REPO}:${QUANT}" --no-mmproj \
            --host 0.0.0.0 --port 8080 -t 4 -np 1 -c 4096

      - name: Wait for model
        run: |
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' llm-server 2>/dev/null | grep -q true; then
              docker logs llm-server
              exit 1
            fi
            sleep 2
          done
          docker logs llm-server
          exit 1

      - name: Start resource sampler
        run: |
          (
            while docker inspect llm-server >/dev/null 2>&1; do
              printf '%s\t%s\n' \
                "$(date -u +%FT%TZ)" \
                "$(docker stats --no-stream --format '{{json .}}' llm-server 2>/dev/null || echo '{}')" \
                >> "results/${{ matrix.key }}-resources.tsv"
              sleep 1
            done
          ) &
          echo $! > results/sampler.pid

      - name: Run benchmark
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 runner/benchmark.py \
            --fixture "benchmark-fixtures/benchmarks/${{ needs.prepare.outputs.fixture }}" \
            --skill skills/small-fix/SKILL.md \
            --model-key "${{ matrix.key }}" \
            --repetitions "${{ needs.prepare.outputs.repetitions }}" \
            --output "results/${{ matrix.key }}.json" \
            > "results/${{ matrix.key }}-runner.log" 2>&1

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p results
          if [ -f results/sampler.pid ]; then kill "$(cat results/sampler.pid)" 2>/dev/null || true; fi
          docker logs llm-server > "results/${{ matrix.key }}-server.log" 2>&1 || true
          docker stop llm-server >/dev/null 2>&1 || true

      - name: Persist results privately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CONTROL_REPO_TOKEN }}
          CONTROL_REPO: ${{ secrets.CONTROL_REPO }}
          MODEL_KEY: ${{ matrix.key }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tar -czf "/tmp/${MODEL_KEY}.tgz" results
          content=$(base64 -w0 "/tmp/${MODEL_KEY}.tgz")
          gh api --method PUT \
            "repos/${CONTROL_REPO}/contents/benchmark-results/${RUN_ID}/raw/${MODEL_KEY}.tgz" \
            -f message="Store benchmark run ${RUN_ID} result" \
            -f content="$content" >/dev/null

  aggregate:
    if: ${{ always() && needs.prepare.outputs.enabled == 'true' }}
    needs: [prepare, benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Check private result sink
        env:
          CONTROL_REPO: ${{ secrets.CONTROL_REPO }}
          CONTROL_REPO_TOKEN: ${{ secrets.CONTROL_REPO_TOKEN }}
        run: |
          test -n "$CONTROL_REPO" || exit 1
          test -n "$CONTROL_REPO_TOKEN" || exit 1

      - uses: actions/checkout@v5

      - name: Download private raw results
        env:
          GH_TOKEN: ${{ secrets.CONTROL_REPO_TOKEN }}
          CONTROL_REPO: ${{ secrets.CONTROL_REPO }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p downloaded results
          python3 - <<'PY' > /tmp/model-keys
          import json, os
          models = json.load(open('config/models.json'))['models']
          profile = os.environ['PROFILE']
          for m in models:
              if profile == 'extended' or m['tier'] == 'core':
                  print(m['key'])
          PY
          while read -r key; do
            if gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${CONTROL_REPO}/contents/benchmark-results/${RUN_ID}/raw/${key}.tgz" \
              > "downloaded/${key}.tgz" 2>/dev/null; then
              mkdir -p "downloaded/${key}"
              tar -xzf "downloaded/${key}.tgz" -C "downloaded/${key}"
              find "downloaded/${key}" -type f -name "${key}.json" -exec cp {} results/ \;
            fi
          done < /tmp/model-keys

      - name: Build private summary
        run: python3 runner/aggregate.py > /dev/null

      - name: Persist aggregate privately
        env:
          GH_TOKEN: ${{ secrets.CONTROL_REPO_TOKEN }}
          CONTROL_REPO: ${{ secrets.CONTROL_REPO }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for file in report/summary.json report/summary.md; do
            name=$(basename "$file")
            content=$(base64 -w0 "$file")
            gh api --method PUT \
              "repos/${CONTROL_REPO}/contents/benchmark-results/${RUN_ID}/${name}" \
              -f message="Store benchmark run ${RUN_ID} aggregate" \
              -f content="$content" >/dev/null
          done
